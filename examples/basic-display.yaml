esphome:
  name: basic-st7789-display

esp32:
  board: esp32-s3-devkitc-1

display:
  - platform: st7789v
    id: main_display
    width: 172
    height: 320
    rotation: 0
    cs_pin: GPIO9
    dc_pin: GPIO11

lvgl:
  displays:
    - main_display
  widgets:
    - label:
        id: title
        text: "Basic Display"
        x: 10
        y: 10
    - button:
        id: btn1
        text: "Click Me"
        x: 10
        y: 50
        width: 120
        height: 40
